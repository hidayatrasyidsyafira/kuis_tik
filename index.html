<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kotak Dinamis - 10 Soal</title>
    <style>
        /* ========================================
           RESET & BASE
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           HEADER
           ======================================== */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* ========================================
           STATS
           ======================================== */
        .stats {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats div {
            text-align: center;
            flex: 1;
            min-width: 70px;
        }

        .stats .number {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
        }

        .stats .label {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        /* ========================================
           GRID KOTAK SOAL
           ======================================== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .soal-box {
            aspect-ratio: 1 / 1;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            position: relative;
            min-height: 100px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .soal-box:hover:not(.disabled):not(.correct) {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .soal-box .nomor {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .soal-box .status-icon {
            font-size: 24px;
            margin-top: 5px;
        }

        /* State: Belum dijawab */
        .soal-box.pending {
            border-color: #e0e0e0;
            background: white;
        }

        .soal-box.pending .nomor {
            color: #667eea;
        }

        /* State: Benar (disable) */
        .soal-box.correct {
            border-color: #28a745;
            background: #d4edda;
            cursor: default;
            opacity: 0.6;
        }

        .soal-box.correct .nomor {
            color: #28a745;
        }

        /* State: Salah */
        .soal-box.wrong {
            border-color: #dc3545;
            background: #f8d7da;
            cursor: pointer;
            animation: shake 0.5s ease;
        }

        .soal-box.wrong .nomor {
            color: #dc3545;
        }

        /* State: Habis (tidak ada soal tersisa) */
        .soal-box.empty {
            border-color: #e0e0e0;
            background: #f8f9fa;
            cursor: default;
            opacity: 0.4;
        }

        .soal-box.empty .nomor {
            color: #999;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        /* ========================================
           MODAL
           ======================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 550px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlide 0.3s ease;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes modalSlide {
            from {
                transform: translateY(30px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-header .nomor-soal {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: all 0.2s ease;
            padding: 0 10px;
        }

        .modal-header .close-btn:hover {
            color: #dc3545;
            transform: rotate(90deg);
        }

        .modal .soal-text {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
            padding: 10px 0;
        }

        /* ===== BINTANG ===== */
        .modal .bintang-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .modal .bintang-section .label {
            font-weight: 700;
            color: #856404;
            font-size: 16px;
        }

        .modal .bintang-section .bintang-value {
            font-size: 28px;
            letter-spacing: 4px;
            color: #ffc107;
        }

        .modal .bintang-section .bintang-value.empty {
            color: #ddd;
        }

        .modal .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            color: #333;
            font-weight: 500;
        }

        .modal .option-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .modal .option-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .modal .option-btn.correct-opt {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .modal .option-btn.wrong-opt {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .modal .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .modal .feedback {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0 20px;
        }

        .modal .feedback.benar {
            background: #d4edda;
            color: #28a745;
        }

        .modal .feedback.salah {
            background: #f8d7da;
            color: #dc3545;
        }

        .modal .btn-group-modal {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal .btn-cek {
            background: #28a745;
            color: white;
        }

        .modal .btn-cek:hover:not(:disabled) {
            background: #218838;
            transform: scale(1.03);
        }

        .modal .btn-cek:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .modal .btn-next {
            background: #667eea;
            color: white;
        }

        .modal .btn-next:hover {
            background: #5a67d8;
            transform: scale(1.03);
        }

        .modal .btn-tutup {
            background: #6c757d;
            color: white;
        }

        .modal .btn-tutup:hover {
            background: #5a6268;
        }

        /* ========================================
           TOMBOL RESET
           ======================================== */
        .btn-group-bottom {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* ========================================
           LOADING & ERROR
           ======================================== */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .soal-box {
                min-height: 80px;
                padding: 8px;
            }

            .soal-box .nomor {
                font-size: 22px;
            }

            .modal {
                padding: 25px;
            }

            .modal .soal-text {
                font-size: 18px;
            }

            .modal .option-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .modal .option-btn {
                padding: 12px 16px;
                font-size: 15px;
            }

            .modal .bintang-section .bintang-value {
                font-size: 22px;
            }
        }

        @media (max-width: 450px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .soal-box {
                min-height: 70px;
            }

            .soal-box .nomor {
                font-size: 18px;
            }

            .soal-box .status-icon {
                font-size: 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .modal {
                padding: 20px;
            }

            .modal .soal-text {
                font-size: 16px;
            }

            .modal .bintang-section .bintang-value {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📦 Kuis Dinamis</h1>
            <p>Selalu tampil 10 soal. Jika benar, soal baru akan muncul! 🔄</p>
        </div>

        <!-- LOADING -->
        <div id="loading" class="loading show">
            <div class="spinner"></div>
            <p>Memuat soal...</p>
        </div>

        <!-- ERROR -->
        <div id="errorMessage" class="error-message">
            <strong>⚠️ Error:</strong> <span id="errorText">Gagal memuat soal</span>
            <br>
            <button class="btn btn-primary" onclick="loadQuestions()" style="margin-top:10px;">🔄 Coba Lagi</button>
        </div>

        <!-- QUIZ -->
        <div id="quizContent" style="display: none;">
            <!-- STATS -->
            <div class="stats">
                <div>
                    <div class="number" id="totalSoal">0</div>
                    <div class="label">Total Soal</div>
                </div>
                <div>
                    <div class="number" id="selesai">0</div>
                    <div class="label">✅ Selesai</div>
                </div>
                <div>
                    <div class="number" id="score">0</div>
                    <div class="label">⭐ Skor</div>
                </div>
                <div>
                    <div class="number" id="tersisa">0</div>
                    <div class="label">📦 Tersisa</div>
                </div>
            </div>

            <!-- GRID KOTAK -->
            <div class="grid-container" id="gridContainer">
                <!-- Kotak akan digenerate oleh JS -->
            </div>

            <!-- TOMBOL -->
            <div class="btn-group-bottom">
                <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset Semua</button>
            </div>
        </div>
    </div>

    <!-- ========================================
    MODAL
    ======================================== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span class="nomor-soal" id="modalNomor">Soal 1</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="soal-text" id="modalSoal">Memuat soal...</div>

            <!-- ===== BINTANG SECTION ===== -->
            <div class="bintang-section" id="modalBintang">
                <span class="label">⭐ Bintang:</span>
                <span class="bintang-value" id="modalBintangValue">⭐⭐⭐⭐⭐</span>
            </div>

            <div class="option-grid" id="modalOptions">
                <!-- Opsi akan diisi JS -->
            </div>

            <div class="feedback" id="modalFeedback"></div>

            <div class="btn-group-modal">
                <button class="btn btn-cek" id="modalCekBtn" disabled>✅ Cek Jawaban</button>
                <button class="btn btn-next" id="modalNextBtn" style="display:none;">➡️ Soal Berikutnya</button>
                <button class="btn btn-tutup" onclick="closeModal()">✕ Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  KONFIGURASI
        // ============================================================
        // 🔧 GANTI DENGAN URL DEPLOYMENT ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycHGGdzzfUoTFEKz7QdIsL24N_DU5ZJVcfLvGFKpL9Z8fG8YBE074AxoUeVxLNAFmI/exec';

        // Jumlah kotak yang ditampilkan
        const BOX_COUNT = 10;

        // ============================================================
        //  STATE
        // ============================================================
        let allQuestions = [];
        let queueQuestions = [];
        let activeBoxes = [];
        let score = 0;
        let completed = 0;

        let isModalOpen = false;
        let currentBoxIndex = -1;
        let selectedOption = null;
        let isAnswered = false;

        // ============================================================
        //  DOM
        // ============================================================
        const loading = document.getElementById('loading');
        const quizContent = document.getElementById('quizContent');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const gridContainer = document.getElementById('gridContainer');
        const totalSoalEl = document.getElementById('totalSoal');
        const selesaiEl = document.getElementById('selesai');
        const scoreEl = document.getElementById('score');
        const tersisaEl = document.getElementById('tersisa');

        // Modal
        const modalOverlay = document.getElementById('modalOverlay');
        const modalNomor = document.getElementById('modalNomor');
        const modalSoal = document.getElementById('modalSoal');
        const modalBintangValue = document.getElementById('modalBintangValue');
        const modalOptions = document.getElementById('modalOptions');
        const modalFeedback = document.getElementById('modalFeedback');
        const modalCekBtn = document.getElementById('modalCekBtn');
        const modalNextBtn = document.getElementById('modalNextBtn');

        // ============================================================
        //  LOAD SOAL
        // ============================================================
        async function loadQuestions() {
            try {
                loading.classList.add('show');
                quizContent.style.display = 'none';
                errorMessage.classList.remove('show');

                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (!data || data.error) {
                    throw new Error(data?.error || 'Data kosong');
                }

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Tidak ada soal');
                }

                // Validasi dengan kolom Bintang opsional
                const valid = data.filter(q =>
                    q.Soal?.trim() &&
                    q['Pilihan A']?.trim() &&
                    q.Jawaban?.trim()
                );

                if (valid.length === 0) {
                    throw new Error('Tidak ada soal valid');
                }

                allQuestions = valid;
                console.log(`✅ ${allQuestions.length} soal dimuat`);

                resetQuiz();

                loading.classList.remove('show');
                quizContent.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                loading.classList.remove('show');
                errorText.textContent = error.message || 'Gagal memuat soal';
                errorMessage.classList.add('show');
            }
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetQuiz() {
            const shuffled = [...allQuestions];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            queueQuestions = shuffled;
            activeBoxes = [];
            score = 0;
            completed = 0;

            for (let i = 0; i < BOX_COUNT; i++) {
                if (queueQuestions.length > 0) {
                    const soal = queueQuestions.shift();
                    activeBoxes.push({
                        soal: soal,
                        status: 'pending',
                        nomorAsli: i + 1
                    });
                } else {
                    activeBoxes.push({
                        soal: null,
                        status: 'empty',
                        nomorAsli: i + 1
                    });
                }
            }

            closeModal();
            updateStats();
            renderGrid();
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        function renderGrid() {
            gridContainer.innerHTML = '';

            activeBoxes.forEach((box, index) => {
                const div = document.createElement('div');
                const status = box.status;
                div.className = `soal-box ${status}`;

                if (status === 'correct') {
                    div.innerHTML = `
                                <span class="nomor" style="color:#28a745;">${box.nomorAsli}</span>
                                <span class="status-icon">✅</span>
                            `;
                } else if (status === 'wrong') {
                    div.innerHTML = `
                                <span class="nomor" style="color:#dc3545;">${box.nomorAsli}</span>
                                <span class="status-icon">❌</span>
                            `;
                    div.onclick = () => openModal(index);
                } else if (status === 'empty') {
                    div.innerHTML = `
                                <span class="nomor" style="color:#999;">✕</span>
                                <span class="status-icon">📭</span>
                            `;
                } else if (status === 'pending') {
                    div.innerHTML = `
                                <span class="nomor">${box.nomorAsli}</span>
                                <span class="status-icon">📦</span>
                            `;
                    div.onclick = () => openModal(index);
                }

                gridContainer.appendChild(div);
            });

            updateStats();
        }

        // ============================================================
        //  AMBIL SOAL BARU DARI ANTRIAN
        // ============================================================
        function getNewQuestion() {
            if (queueQuestions.length > 0) {
                return queueQuestions.shift();
            }
            return null;
        }

        // ============================================================
        //  GANTI SOAL DI KOTAK
        // ============================================================
        function replaceQuestion(index) {
            const newSoal = getNewQuestion();
            if (newSoal) {
                activeBoxes[index].soal = newSoal;
                activeBoxes[index].status = 'pending';
            } else {
                activeBoxes[index].soal = null;
                activeBoxes[index].status = 'empty';
            }
            renderGrid();
        }

        // ============================================================
        //  RENDER BINTANG
        // ============================================================
        function renderBintang(value) {
            if (!value || value.trim() === '') {
                return '<span style="color:#ddd;">☆☆☆☆☆</span>';
            }

            // Ubah ke string dan ambil karakter pertama
            const str = value.toString().trim();
            const count = parseInt(str) || 0;

            // Maksimal 5 bintang
            const starCount = Math.min(Math.max(count, 0), 5);
            const filled = '⭐'.repeat(starCount);
            const empty = '☆'.repeat(5 - starCount);

            return filled + empty;
        }

        // ============================================================
        //  MODAL
        // ============================================================
        function openModal(index) {
            const box = activeBoxes[index];
            if (!box || box.status === 'correct' || box.status === 'empty') return;
            if (isModalOpen) return;

            currentBoxIndex = index;
            isModalOpen = true;
            selectedOption = null;
            isAnswered = false;

            const q = box.soal;
            const total = allQuestions.length;
            const done = completed;
            modalNomor.textContent = `Soal ${box.nomorAsli} (${done + 1}/${total})`;
            modalSoal.textContent = q.Soal;

            // ===== TAMPILKAN BINTANG =====
            const bintangValue = q['Bintang'] || '';
            modalBintangValue.innerHTML = renderBintang(bintangValue);

            modalFeedback.textContent = '';
            modalFeedback.className = 'feedback';

            const options = [
                { label: 'A', value: q['Pilihan A'] },
                { label: 'B', value: q['Pilihan B'] },
                { label: 'C', value: q['Pilihan C'] },
                { label: 'D', value: q['Pilihan D'] }
            ];

            modalOptions.innerHTML = '';
            options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${opt.label}. ${opt.value || '-'}`;
                btn.dataset.value = opt.label;
                btn.onclick = () => selectOptionModal(btn, opt.label);
                modalOptions.appendChild(btn);
            });

            modalCekBtn.disabled = true;
            modalCekBtn.style.display = 'inline-block';
            modalNextBtn.style.display = 'none';
            modalCekBtn.onclick = () => cekJawabanModal();

            modalOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('show');
            document.body.style.overflow = '';
            isModalOpen = false;
            currentBoxIndex = -1;
        }

        // ============================================================
        //  MODAL - SELECT OPTION
        // ============================================================
        function selectOptionModal(button, value) {
            if (isAnswered) return;

            const allBtns = modalOptions.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.remove('selected'));

            button.classList.add('selected');
            selectedOption = value;
            modalCekBtn.disabled = false;
        }

        // ============================================================
        //  MODAL - CEK JAWABAN
        // ============================================================
        function cekJawabanModal() {
            if (!selectedOption || isAnswered) return;

            const index = currentBoxIndex;
            const box = activeBoxes[index];
            if (!box || !box.soal) return;

            const q = box.soal;
            const correct = q.Jawaban?.trim().toUpperCase() || 'A';
            const isCorrect = selectedOption === correct;

            const allBtns = modalOptions.querySelectorAll('.option-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                if (b.dataset.value === correct) {
                    b.classList.add('correct-opt');
                }
                if (b.dataset.value === selectedOption && !isCorrect) {
                    b.classList.add('wrong-opt');
                }
            });

            modalCekBtn.disabled = true;

            if (isCorrect) {
                score++;
                completed++;
                box.status = 'correct';

                modalFeedback.textContent = '✅ Benar! Soal baru akan menggantikan ini! 🎉';
                modalFeedback.className = 'feedback benar';

                modalCekBtn.style.display = 'none';
                modalNextBtn.style.display = 'inline-block';
                modalNextBtn.textContent = '➡️ Soal Berikutnya';
                modalNextBtn.onclick = () => {
                    closeModal();
                    replaceQuestion(index);
                    if (queueQuestions.length === 0 && !activeBoxes.some(b => b.status === 'pending' || b.status ===
                            'wrong')) {
                        setTimeout(() => {
                            alert('🎉 Semua soal selesai! Skor: ' + score + '/' + allQuestions.length);
                        }, 300);
                    } else {
                        const nextIndex = findNextPending(index);
                        if (nextIndex !== -1) {
                            setTimeout(() => openModal(nextIndex), 400);
                        }
                    }
                    renderGrid();
                };

            } else {
                box.status = 'wrong';
                modalFeedback.textContent = `❌ Salah! Jawaban yang benar: ${correct}`;
                modalFeedback.className = 'feedback salah';

                modalCekBtn.textContent = '🔄 Coba Lagi';
                modalCekBtn.disabled = false;
                modalCekBtn.onclick = () => {
                    closeModal();
                    renderGrid();
                    setTimeout(() => openModal(index), 300);
                };
            }

            isAnswered = true;
            updateStats();
            renderGrid();
        }

        // ============================================================
        //  FIND NEXT PENDING
        // ============================================================
        function findNextPending(fromIndex) {
            for (let i = fromIndex + 1; i < activeBoxes.length; i++) {
                if (activeBoxes[i].status === 'pending' || activeBoxes[i].status === 'wrong') {
                    return i;
                }
            }
            for (let i = 0; i < fromIndex; i++) {
                if (activeBoxes[i].status === 'pending' || activeBoxes[i].status === 'wrong') {
                    return i;
                }
            }
            return -1;
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            const total = allQuestions.length || 0;
            totalSoalEl.textContent = total;
            selesaiEl.textContent = completed;
            scoreEl.textContent = score;

            const remaining = queueQuestions.length +
                activeBoxes.filter(b => b.status === 'pending' || b.status === 'wrong').length;
            tersisaEl.textContent = remaining;
        }

        // ============================================================
        //  TUTUP MODAL KALAU KLIK DI LUAR
        // ============================================================
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // ============================================================
        //  ESC UNTUK TUTUP MODAL
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isModalOpen) {
                closeModal();
            }
        });

        // ============================================================
        //  EXPOSE
        // ============================================================
        window.loadQuestions = loadQuestions;
        window.resetQuiz = resetQuiz;
        window.closeModal = closeModal;
        window.openModal = openModal;

        // ============================================================
        //  START
        // ============================================================
        loadQuestions();
    </script>
</body>
</html>
