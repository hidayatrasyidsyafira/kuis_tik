<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kotak - Soal Acak</title>
    <style>
        /* ========================================
           RESET & BASE
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           HEADER
           ======================================== */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* ========================================
           STATS
           ======================================== */
        .stats {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats div {
            text-align: center;
            flex: 1;
            min-width: 70px;
        }

        .stats .number {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
        }

        .stats .label {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        /* ========================================
           GRID KOTAK SOAL
           ======================================== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .soal-box {
            aspect-ratio: 1 / 1;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            position: relative;
            min-height: 120px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .soal-box:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .soal-box .nomor {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .soal-box .status-icon {
            font-size: 20px;
            margin-top: 5px;
        }

        /* State: Belum dijawab */
        .soal-box.pending {
            border-color: #e0e0e0;
            background: white;
        }

        .soal-box.pending .nomor {
            color: #667eea;
        }

        /* State: Sedang dikerjakan (aktif) */
        .soal-box.active {
            border-color: #667eea;
            background: #f0f3ff;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .soal-box.active .nomor {
            color: #667eea;
            font-size: 16px;
        }

        /* State: Benar */
        .soal-box.correct {
            border-color: #28a745;
            background: #d4edda;
            cursor: default;
        }

        .soal-box.correct .nomor {
            color: #28a745;
        }

        /* State: Salah */
        .soal-box.wrong {
            border-color: #dc3545;
            background: #f8d7da;
            animation: shake 0.5s ease;
        }

        .soal-box.wrong .nomor {
            color: #dc3545;
        }

        /* State: Disabled */
        .soal-box.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        /* ========================================
           ISI KOTAK SAAT AKTIF
           ======================================== */
        .soal-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            text-align: center;
            gap: 5px;
        }

        .soal-content .soal-text {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            margin-bottom: 5px;
            line-height: 1.3;
            max-height: 40px;
            overflow: hidden;
        }

        .soal-content .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 100%;
        }

        .soal-content .option-btn-small {
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #333;
            font-weight: 500;
        }

        .soal-content .option-btn-small:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .soal-content .option-btn-small.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .soal-content .option-btn-small.correct-opt {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .soal-content .option-btn-small.wrong-opt {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .soal-content .option-btn-small:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .soal-content .btn-cek-kecil {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s ease;
        }

        .soal-content .btn-cek-kecil:hover:not(:disabled) {
            background: #218838;
            transform: scale(1.05);
        }

        .soal-content .btn-cek-kecil:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .soal-content .feedback {
            font-size: 11px;
            font-weight: 600;
            margin-top: 3px;
        }

        .soal-content .feedback.benar {
            color: #28a745;
        }
        .soal-content .feedback.salah {
            color: #dc3545;
        }

        /* ========================================
           TOMBOL RESET
           ======================================== */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* ========================================
           LOADING & ERROR
           ======================================== */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .soal-box {
                min-height: 100px;
                padding: 8px;
            }

            .soal-box .nomor {
                font-size: 22px;
            }

            .soal-content .soal-text {
                font-size: 11px;
                max-height: 32px;
            }

            .soal-content .option-btn-small {
                font-size: 10px;
                padding: 3px 5px;
            }

            .stats {
                padding: 10px 15px;
            }

            .stats .number {
                font-size: 18px;
            }
        }

        @media (max-width: 450px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .soal-box {
                min-height: 80px;
            }

            .soal-box .nomor {
                font-size: 18px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📦 Kuis Kotak</h1>
            <p>Klik kotak untuk membuka soal ⬅️➡️</p>
        </div>

        <!-- LOADING -->
        <div id="loading" class="loading show">
            <div class="spinner"></div>
            <p>Memuat soal...</p>
        </div>

        <!-- ERROR -->
        <div id="errorMessage" class="error-message">
            <strong>⚠️ Error:</strong> <span id="errorText">Gagal memuat soal</span>
            <br>
            <button class="btn btn-primary" onclick="loadQuestions()" style="margin-top:10px;">🔄 Coba Lagi</button>
        </div>

        <!-- QUIZ -->
        <div id="quizContent" style="display: none;">
            <!-- STATS -->
            <div class="stats">
                <div>
                    <div class="number" id="totalSoal">0</div>
                    <div class="label">Total Soal</div>
                </div>
                <div>
                    <div class="number" id="selesai">0</div>
                    <div class="label">✅ Selesai</div>
                </div>
                <div>
                    <div class="number" id="score">0</div>
                    <div class="label">⭐ Skor</div>
                </div>
            </div>

            <!-- GRID KOTAK -->
            <div class="grid-container" id="gridContainer">
                <!-- Kotak akan digenerate oleh JS -->
            </div>

            <!-- TOMBOL -->
            <div class="btn-group">
                <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset Semua</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  KONFIGURASI
        // ============================================================
        // 🔧 GANTI DENGAN URL DEPLOYMENT ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycHGGdzzfUoTFEKz7QdIsL24N_DU5ZJVcfLvGFKpL9Z8fG8YBE074AxoUeVxLNAFmI/exec';

        // ============================================================
        //  STATE
        // ============================================================
        let questions = [];
        let currentQuestions = [];
        let score = 0;
        let completed = 0;
        let activeIndex = -1; // Index kotak yang sedang aktif
        let selectedOption = null;
        let isAnswered = false;

        // State per kotak
        let boxStates = {}; // { index: 'pending' | 'active' | 'correct' | 'wrong' }

        // ============================================================
        //  DOM
        // ============================================================
        const loading = document.getElementById('loading');
        const quizContent = document.getElementById('quizContent');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const gridContainer = document.getElementById('gridContainer');
        const totalSoalEl = document.getElementById('totalSoal');
        const selesaiEl = document.getElementById('selesai');
        const scoreEl = document.getElementById('score');

        // ============================================================
        //  LOAD SOAL
        // ============================================================
        async function loadQuestions() {
            try {
                loading.classList.add('show');
                quizContent.style.display = 'none';
                errorMessage.classList.remove('show');

                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (!data || data.error) {
                    throw new Error(data?.error || 'Data kosong');
                }

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Tidak ada soal');
                }

                // Validasi
                const valid = data.filter(q =>
                    q.Soal?.trim() &&
                    q['Pilihan A']?.trim() &&
                    q.Jawaban?.trim()
                );

                if (valid.length === 0) {
                    throw new Error('Tidak ada soal valid');
                }

                questions = valid;
                console.log(`✅ ${questions.length} soal dimuat`);

                resetQuiz();

                loading.classList.remove('show');
                quizContent.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                loading.classList.remove('show');
                errorText.textContent = error.message || 'Gagal memuat soal';
                errorMessage.classList.add('show');
            }
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetQuiz() {
            // Acak soal
            currentQuestions = [...questions];
            for (let i = currentQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
            }

            score = 0;
            completed = 0;
            activeIndex = -1;
            selectedOption = null;
            isAnswered = false;

            // Reset state box
            boxStates = {};
            currentQuestions.forEach((_, i) => {
                boxStates[i] = 'pending';
            });

            updateStats();
            renderGrid();
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        function renderGrid() {
            gridContainer.innerHTML = '';

            currentQuestions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = `soal-box ${boxStates[index]}`;
                box.dataset.index = index;

                if (boxStates[index] === 'correct' || boxStates[index] === 'wrong') {
                    box.classList.add('disabled');
                }

                // Isi kotak
                const state = boxStates[index];

                if (state === 'pending') {
                    // Tampilkan nomor
                    box.innerHTML = `
                                <span class="nomor">${index + 1}</span>
                                <span class="status-icon">📦</span>
                            `;
                    box.onclick = () => openBox(index);

                } else if (state === 'active') {
                    // Tampilkan soal + pilihan
                    renderActiveBox(box, q, index);
                    box.onclick = null;

                } else if (state === 'correct') {
                    box.innerHTML = `
                                <span class="nomor" style="color:#28a745;">${index + 1}</span>
                                <span class="status-icon">✅</span>
                            `;
                    box.onclick = null;

                } else if (state === 'wrong') {
                    box.innerHTML = `
                                <span class="nomor" style="color:#dc3545;">${index + 1}</span>
                                <span class="status-icon">❌</span>
                            `;
                    box.onclick = () => openBox(index); // Bisa diklik ulang
                }

                gridContainer.appendChild(box);
            });

            updateStats();
        }

        // ============================================================
        //  RENDER ACTIVE BOX
        // ============================================================
        function renderActiveBox(box, q, index) {
            const options = [
                { label: 'A', value: q['Pilihan A'] },
                { label: 'B', value: q['Pilihan B'] },
                { label: 'C', value: q['Pilihan C'] },
                { label: 'D', value: q['Pilihan D'] }
            ];

            let optHTML = options.map((opt, i) => `
                        <button class="option-btn-small" data-value="${opt.label}" data-index="${i}">
                            ${opt.label}. ${opt.value || '-'}
                        </button>
                    `).join('');

            box.innerHTML = `
                        <div class="soal-content">
                            <div class="soal-text">${q.Soal}</div>
                            <div class="option-grid">${optHTML}</div>
                            <button class="btn-cek-kecil" id="cekBtn${index}" disabled>✅ Cek</button>
                            <div class="feedback" id="feedback${index}"></div>
                        </div>
                    `;

            // Event listener untuk pilihan
            const optionBtns = box.querySelectorAll('.option-btn-small');
            const cekBtn = box.querySelector(`#cekBtn${index}`);
            const feedback = box.querySelector(`#feedback${index}`);

            // Reset state untuk box ini
            selectedOption = null;
            isAnswered = false;
            cekBtn.disabled = true;
            feedback.textContent = '';

            optionBtns.forEach(btn => {
                btn.onclick = () => {
                    if (isAnswered) return;

                    // Hapus selected dari semua
                    optionBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOption = btn.dataset.value;
                    cekBtn.disabled = false;
                };
            });

            // Cek jawaban
            cekBtn.onclick = () => {
                if (!selectedOption || isAnswered) return;

                const correct = q.Jawaban?.trim().toUpperCase() || 'A';
                const isCorrect = selectedOption === correct;

                // Disable semua tombol
                optionBtns.forEach(b => b.disabled = true);
                cekBtn.disabled = true;

                // Tampilkan jawaban benar/salah
                optionBtns.forEach(b => {
                    if (b.dataset.value === correct) {
                        b.classList.add('correct-opt');
                    }
                    if (b.dataset.value === selectedOption && !isCorrect) {
                        b.classList.add('wrong-opt');
                    }
                });

                if (isCorrect) {
                    score++;
                    completed++;
                    feedback.textContent = '✅ Benar!';
                    feedback.className = 'feedback benar';
                    boxStates[index] = 'correct';

                    // Auto buka soal berikutnya setelah delay
                    setTimeout(() => {
                        const nextIndex = findNextPending(index);
                        if (nextIndex !== -1) {
                            openBox(nextIndex);
                        } else {
                            // Semua selesai
                            renderGrid();
                            alert('🎉 Semua soal selesai! Skor: ' + score + '/' + currentQuestions.length);
                        }
                        renderGrid();
                    }, 800);

                } else {
                    feedback.textContent = `❌ Salah! Jawaban: ${correct}`;
                    feedback.className = 'feedback salah';
                    boxStates[index] = 'wrong';

                    // Bisa dicoba lagi setelah 1.5 detik
                    setTimeout(() => {
                        // Reset box ke pending agar bisa dibuka ulang
                        boxStates[index] = 'pending';
                        renderGrid();
                        // Buka otomatis
                        openBox(index);
                    }, 1500);
                }

                isAnswered = true;
                updateStats();
            };
        }

        // ============================================================
        //  OPEN BOX
        // ============================================================
        function openBox(index) {
            // Tutup box yang aktif sebelumnya
            if (activeIndex !== -1 && activeIndex !== index) {
                if (boxStates[activeIndex] === 'active') {
                    boxStates[activeIndex] = 'pending';
                }
            }

            // Jika box sudah correct, tidak bisa dibuka
            if (boxStates[index] === 'correct') return;

            // Set active
            boxStates[index] = 'active';
            activeIndex = index;
            renderGrid();

            // Scroll ke box yang aktif (di mobile)
            const boxes = gridContainer.querySelectorAll('.soal-box');
            if (boxes[index]) {
                boxes[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // ============================================================
        //  FIND NEXT PENDING
        // ============================================================
        function findNextPending(fromIndex) {
            for (let i = fromIndex + 1; i < currentQuestions.length; i++) {
                if (boxStates[i] === 'pending' || boxStates[i] === 'wrong') {
                    return i;
                }
            }
            // Cari dari awal
            for (let i = 0; i < fromIndex; i++) {
                if (boxStates[i] === 'pending' || boxStates[i] === 'wrong') {
                    return i;
                }
            }
            return -1;
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            totalSoalEl.textContent = currentQuestions.length || 0;
            selesaiEl.textContent = completed;
            scoreEl.textContent = score;
        }

        // ============================================================
        //  EXPOSE
        // ============================================================
        window.loadQuestions = loadQuestions;
        window.resetQuiz = resetQuiz;

        // ============================================================
        //  START
        // ============================================================
        loadQuestions();
    </script>
</body>
</html>
