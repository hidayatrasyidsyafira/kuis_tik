<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kotak - Modal</title>
    <style>
        /* ========================================
           RESET & BASE
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           HEADER
           ======================================== */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* ========================================
           STATS
           ======================================== */
        .stats {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats div {
            text-align: center;
            flex: 1;
            min-width: 70px;
        }

        .stats .number {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
        }

        .stats .label {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        /* ========================================
           GRID KOTAK SOAL
           ======================================== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .soal-box {
            aspect-ratio: 1 / 1;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            position: relative;
            min-height: 100px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .soal-box:hover:not(.disabled):not(.correct) {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .soal-box .nomor {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .soal-box .status-icon {
            font-size: 24px;
            margin-top: 5px;
        }

        /* State: Belum dijawab */
        .soal-box.pending {
            border-color: #e0e0e0;
            background: white;
        }

        .soal-box.pending .nomor {
            color: #667eea;
        }

        /* State: Sedang diproses (disable klik) */
        .soal-box.loading {
            border-color: #ffc107;
            background: #fff3cd;
            cursor: wait;
        }

        .soal-box.loading .nomor {
            color: #ffc107;
        }

        /* State: Benar */
        .soal-box.correct {
            border-color: #28a745;
            background: #d4edda;
            cursor: default;
        }

        .soal-box.correct .nomor {
            color: #28a745;
        }

        /* State: Salah */
        .soal-box.wrong {
            border-color: #dc3545;
            background: #f8d7da;
            cursor: pointer;
            animation: shake 0.5s ease;
        }

        .soal-box.wrong .nomor {
            color: #dc3545;
        }

        /* State: Disabled */
        .soal-box.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        /* ========================================
           MODAL
           ======================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 550px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlide 0.3s ease;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes modalSlide {
            from {
                transform: translateY(30px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-header .nomor-soal {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: all 0.2s ease;
            padding: 0 10px;
        }

        .modal-header .close-btn:hover {
            color: #dc3545;
            transform: rotate(90deg);
        }

        .modal .soal-text {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
            padding: 10px 0;
        }

        .modal .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            color: #333;
            font-weight: 500;
        }

        .modal .option-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .modal .option-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .modal .option-btn.correct-opt {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .modal .option-btn.wrong-opt {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .modal .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .modal .feedback {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0 20px;
        }

        .modal .feedback.benar {
            background: #d4edda;
            color: #28a745;
        }

        .modal .feedback.salah {
            background: #f8d7da;
            color: #dc3545;
        }

        .modal .btn-group-modal {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal .btn-cek {
            background: #28a745;
            color: white;
        }

        .modal .btn-cek:hover:not(:disabled) {
            background: #218838;
            transform: scale(1.03);
        }

        .modal .btn-cek:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .modal .btn-next {
            background: #667eea;
            color: white;
        }

        .modal .btn-next:hover {
            background: #5a67d8;
            transform: scale(1.03);
        }

        .modal .btn-tutup {
            background: #6c757d;
            color: white;
        }

        .modal .btn-tutup:hover {
            background: #5a6268;
        }

        /* ========================================
           TOMBOL RESET
           ======================================== */
        .btn-group-bottom {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* ========================================
           LOADING & ERROR
           ======================================== */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .soal-box {
                min-height: 80px;
                padding: 8px;
            }

            .soal-box .nomor {
                font-size: 22px;
            }

            .modal {
                padding: 25px;
            }

            .modal .soal-text {
                font-size: 18px;
            }

            .modal .option-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .modal .option-btn {
                padding: 12px 16px;
                font-size: 15px;
            }
        }

        @media (max-width: 450px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .soal-box {
                min-height: 70px;
            }

            .soal-box .nomor {
                font-size: 18px;
            }

            .soal-box .status-icon {
                font-size: 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .modal {
                padding: 20px;
            }

            .modal .soal-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📦 Kuis Kotak</h1>
            <p>Klik kotak untuk membuka soal di modal ⬅️➡️</p>
        </div>

        <!-- LOADING -->
        <div id="loading" class="loading show">
            <div class="spinner"></div>
            <p>Memuat soal...</p>
        </div>

        <!-- ERROR -->
        <div id="errorMessage" class="error-message">
            <strong>⚠️ Error:</strong> <span id="errorText">Gagal memuat soal</span>
            <br>
            <button class="btn btn-primary" onclick="loadQuestions()" style="margin-top:10px;">🔄 Coba Lagi</button>
        </div>

        <!-- QUIZ -->
        <div id="quizContent" style="display: none;">
            <!-- STATS -->
            <div class="stats">
                <div>
                    <div class="number" id="totalSoal">0</div>
                    <div class="label">Total Soal</div>
                </div>
                <div>
                    <div class="number" id="selesai">0</div>
                    <div class="label">✅ Selesai</div>
                </div>
                <div>
                    <div class="number" id="score">0</div>
                    <div class="label">⭐ Skor</div>
                </div>
            </div>

            <!-- GRID KOTAK -->
            <div class="grid-container" id="gridContainer">
                <!-- Kotak akan digenerate oleh JS -->
            </div>

            <!-- TOMBOL -->
            <div class="btn-group-bottom">
                <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset Semua</button>
            </div>
        </div>
    </div>

    <!-- ========================================
    MODAL
    ======================================== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span class="nomor-soal" id="modalNomor">Soal 1</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="soal-text" id="modalSoal">Memuat soal...</div>

            <div class="option-grid" id="modalOptions">
                <!-- Opsi akan diisi JS -->
            </div>

            <div class="feedback" id="modalFeedback"></div>

            <div class="btn-group-modal">
                <button class="btn btn-cek" id="modalCekBtn" disabled>✅ Cek Jawaban</button>
                <button class="btn btn-next" id="modalNextBtn" style="display:none;">➡️ Soal Berikutnya</button>
                <button class="btn btn-tutup" onclick="closeModal()">✕ Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  KONFIGURASI
        // ============================================================
        // 🔧 GANTI DENGAN URL DEPLOYMENT ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycHGGdzzfUoTFEKz7QdIsL24N_DU5ZJVcfLvGFKpL9Z8fG8YBE074AxoUeVxLNAFmI/exec';

        // ============================================================
        //  STATE
        // ============================================================
        let questions = [];
        let currentQuestions = [];
        let score = 0;
        let completed = 0;
        let activeIndex = -1;
        let selectedOption = null;
        let isAnswered = false;
        let isModalOpen = false;
        let currentModalIndex = -1;

        let boxStates = {};

        // ============================================================
        //  DOM
        // ============================================================
        const loading = document.getElementById('loading');
        const quizContent = document.getElementById('quizContent');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const gridContainer = document.getElementById('gridContainer');
        const totalSoalEl = document.getElementById('totalSoal');
        const selesaiEl = document.getElementById('selesai');
        const scoreEl = document.getElementById('score');

        // Modal
        const modalOverlay = document.getElementById('modalOverlay');
        const modalNomor = document.getElementById('modalNomor');
        const modalSoal = document.getElementById('modalSoal');
        const modalOptions = document.getElementById('modalOptions');
        const modalFeedback = document.getElementById('modalFeedback');
        const modalCekBtn = document.getElementById('modalCekBtn');
        const modalNextBtn = document.getElementById('modalNextBtn');

        // ============================================================
        //  LOAD SOAL
        // ============================================================
        async function loadQuestions() {
            try {
                loading.classList.add('show');
                quizContent.style.display = 'none';
                errorMessage.classList.remove('show');

                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (!data || data.error) {
                    throw new Error(data?.error || 'Data kosong');
                }

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Tidak ada soal');
                }

                const valid = data.filter(q =>
                    q.Soal?.trim() &&
                    q['Pilihan A']?.trim() &&
                    q.Jawaban?.trim()
                );

                if (valid.length === 0) {
                    throw new Error('Tidak ada soal valid');
                }

                questions = valid;
                console.log(`✅ ${questions.length} soal dimuat`);

                resetQuiz();

                loading.classList.remove('show');
                quizContent.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                loading.classList.remove('show');
                errorText.textContent = error.message || 'Gagal memuat soal';
                errorMessage.classList.add('show');
            }
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetQuiz() {
            currentQuestions = [...questions];
            for (let i = currentQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
            }

            score = 0;
            completed = 0;
            activeIndex = -1;
            boxStates = {};
            currentQuestions.forEach((_, i) => {
                boxStates[i] = 'pending';
            });

            closeModal();
            updateStats();
            renderGrid();
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        function renderGrid() {
            gridContainer.innerHTML = '';

            currentQuestions.forEach((q, index) => {
                const box = document.createElement('div');
                const state = boxStates[index] || 'pending';
                box.className = `soal-box ${state}`;
                box.dataset.index = index;

                if (state === 'correct') {
                    box.innerHTML = `
                                <span class="nomor" style="color:#28a745;">${index + 1}</span>
                                <span class="status-icon">✅</span>
                            `;
                } else if (state === 'wrong') {
                    box.innerHTML = `
                                <span class="nomor" style="color:#dc3545;">${index + 1}</span>
                                <span class="status-icon">❌</span>
                            `;
                } else if (state === 'loading') {
                    box.innerHTML = `
                                <span class="nomor" style="color:#ffc107;">${index + 1}</span>
                                <span class="status-icon">⏳</span>
                            `;
                } else {
                    box.innerHTML = `
                                <span class="nomor">${index + 1}</span>
                                <span class="status-icon">📦</span>
                            `;
                }

                if (state !== 'correct') {
                    box.onclick = () => openModal(index);
                }

                gridContainer.appendChild(box);
            });

            updateStats();
        }

        // ============================================================
        //  MODAL
        // ============================================================
        function openModal(index) {
            if (boxStates[index] === 'correct') return;
            if (isModalOpen) return;

            currentModalIndex = index;
            isModalOpen = true;
            selectedOption = null;
            isAnswered = false;

            const q = currentQuestions[index];
            modalNomor.textContent = `Soal ${index + 1} dari ${currentQuestions.length}`;
            modalSoal.textContent = q.Soal;

            // Reset feedback
            modalFeedback.textContent = '';
            modalFeedback.className = 'feedback';

            // Buat opsi
            const options = [
                { label: 'A', value: q['Pilihan A'] },
                { label: 'B', value: q['Pilihan B'] },
                { label: 'C', value: q['Pilihan C'] },
                { label: 'D', value: q['Pilihan D'] }
            ];

            modalOptions.innerHTML = '';
            options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${opt.label}. ${opt.value || '-'}`;
                btn.dataset.value = opt.label;
                btn.dataset.index = i;
                btn.onclick = () => selectOptionModal(btn, opt.label);
                modalOptions.appendChild(btn);
            });

            // Reset tombol
            modalCekBtn.disabled = true;
            modalCekBtn.style.display = 'inline-block';
            modalNextBtn.style.display = 'none';
            modalCekBtn.onclick = () => cekJawabanModal();

            // Tampilkan modal
            modalOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('show');
            document.body.style.overflow = '';
            isModalOpen = false;
            currentModalIndex = -1;
        }

        // ============================================================
        //  MODAL - SELECT OPTION
        // ============================================================
        function selectOptionModal(button, value) {
            if (isAnswered) return;

            const allBtns = modalOptions.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.remove('selected'));

            button.classList.add('selected');
            selectedOption = value;
            modalCekBtn.disabled = false;
        }

        // ============================================================
        //  MODAL - CEK JAWABAN
        // ============================================================
        function cekJawabanModal() {
            if (!selectedOption || isAnswered) return;

            const index = currentModalIndex;
            const q = currentQuestions[index];
            const correct = q.Jawaban?.trim().toUpperCase() || 'A';
            const isCorrect = selectedOption === correct;

            // Disable semua tombol opsi
            const allBtns = modalOptions.querySelectorAll('.option-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                if (b.dataset.value === correct) {
                    b.classList.add('correct-opt');
                }
                if (b.dataset.value === selectedOption && !isCorrect) {
                    b.classList.add('wrong-opt');
                }
            });

            modalCekBtn.disabled = true;

            if (isCorrect) {
                score++;
                completed++;
                boxStates[index] = 'correct';
                modalFeedback.textContent = '✅ Benar! Jawaban Anda tepat! 🎉';
                modalFeedback.className = 'feedback benar';

                // Sembunyikan tombol cek, tampilkan next
                modalCekBtn.style.display = 'none';
                modalNextBtn.style.display = 'inline-block';
                modalNextBtn.onclick = () => {
                    closeModal();
                    renderGrid();
                    // Buka otomatis soal berikutnya
                    const nextIndex = findNextPending(index);
                    if (nextIndex !== -1) {
                        setTimeout(() => openModal(nextIndex), 300);
                    } else {
                        alert('🎉 Semua soal selesai! Skor: ' + score + '/' + currentQuestions.length);
                    }
                };

            } else {
                boxStates[index] = 'wrong';
                modalFeedback.textContent = `❌ Salah! Jawaban yang benar adalah: ${correct}`;
                modalFeedback.className = 'feedback salah';

                // Tampilkan tombol coba lagi setelah 1.5 detik
                modalCekBtn.textContent = '🔄 Coba Lagi';
                modalCekBtn.disabled = false;
                modalCekBtn.onclick = () => {
                    // Reset modal untuk soal yang sama
                    closeModal();
                    // Render grid untuk update status
                    renderGrid();
                    // Buka ulang modal
                    setTimeout(() => openModal(index), 300);
                };
            }

            isAnswered = true;
            updateStats();
            renderGrid();
        }

        // ============================================================
        //  FIND NEXT PENDING
        // ============================================================
        function findNextPending(fromIndex) {
            for (let i = fromIndex + 1; i < currentQuestions.length; i++) {
                if (boxStates[i] === 'pending' || boxStates[i] === 'wrong') {
                    return i;
                }
            }
            for (let i = 0; i < fromIndex; i++) {
                if (boxStates[i] === 'pending' || boxStates[i] === 'wrong') {
                    return i;
                }
            }
            return -1;
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            totalSoalEl.textContent = currentQuestions.length || 0;
            selesaiEl.textContent = completed;
            scoreEl.textContent = score;
        }

        // ============================================================
        //  TUTUP MODAL KALAU KLIK DI LUAR
        // ============================================================
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // ============================================================
        //  ESC UNTUK TUTUP MODAL
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isModalOpen) {
                closeModal();
            }
        });

        // ============================================================
        //  EXPOSE
        // ============================================================
        window.loadQuestions = loadQuestions;
        window.resetQuiz = resetQuiz;
        window.closeModal = closeModal;
        window.openModal = openModal;

        // ============================================================
        //  START
        // ============================================================
        loadQuestions();
    </script>
</body>
</html>
